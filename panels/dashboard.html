<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .deadline-section {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .deadline-badge {
            display: inline-block;
            background-color: #ff9800;
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
        }
        .deadline-text {
            color: #666;
            margin-top: 10px;
            font-size: 14px;
        }
        .summary-section {
            background-color: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .summary-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
        }
        .summary-table th {
            background-color: #f5f5f5;
            color: #333;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }
        .summary-table td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            color: #666;
        }
        .summary-table tr:hover {
            background-color: #f9f9f9;
        }
        .progress-bar {
            width: 100%;
            height: 24px;
            background-color: #eee;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .progress-fill {
            height: 100%;
            background-color: #4caf50;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-submitted {
            background-color: #c8e6c9;
            color: #2e7d32;
        }
        .status-pending {
            background-color: #ffe0b2;
            color: #e65100;
        }
        .nav-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .nav-button:hover {
            background-color: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報提出状況ダッシュボード</h1>
        
        <div class="deadline-section">
            <div class="deadline-badge" id="deadlineBadge">提出期限: 2024年12月31日 17:00</div>
            <div class="deadline-text">日報の提出期限は上記の日時です。期限までに必ず提出してください。</div>
        </div>
        
        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>提出率</th>
                        <th>ステータス</th>
                    </tr>
                </thead>
                <tbody id="summaryBody">
                    <tr>
                        <td>営業部</td>
                        <td>8</td>
                        <td>2</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 80%;">80%</div>
                            </div>
                        </td>
                        <td><span class="status-badge status-submitted">提出済</span></td>
                    </tr>
                    <tr>
                        <td>企画部</td>
                        <td>6</td>
                        <td>1</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 86%;">86%</div>
                            </div>
                        </td>
                        <td><span class="status-badge status-submitted">提出済</span></td>
                    </tr>
                    <tr>
                        <td>技術部</td>
                        <td>5</td>
                        <td>3</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 63%;">63%</div>
                            </div>
                        </td>
                        <td><span class="status-badge status-pending">未提出</span></td>
                    </tr>
                    <tr>
                        <td>管理部</td>
                        <td>4</td>
                        <td>0</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 100%;">100%</div>
                            </div>
                        </td>
                        <td><span class="status-badge status-submitted">提出済</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <a href="./daily-report.html" class="nav-button">日報入力・送信画面へ</a>
    </div>
    
    <script>
        // Initialize dashboard
        function initializeDashboard() {
            // Deadline is already displayed in HTML
            // Summary table is already populated in HTML
            console.log('Dashboard initialized');
        }
        
        window.addEventListener('load', initializeDashboard);
    </script>
</body>
</html>
