<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .deadline-section {
      background-color: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .deadline-section h2 {
      color: #856404;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .deadline-text {
      color: #856404;
      font-size: 18px;
      font-weight: bold;
    }
    .summary-section {
      margin-top: 30px;
    }
    .summary-section h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 20px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
    }
    .summary-table th {
      background-color: #007bff;
      color: white;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      border: 1px solid #ddd;
    }
    .summary-table td {
      padding: 12px;
      border: 1px solid #ddd;
      color: #555;
    }
    .summary-table tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .summary-table tr:hover {
      background-color: #f0f0f0;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-submitted {
      background-color: #d4edda;
      color: #155724;
    }
    .status-pending {
      background-color: #f8d7da;
      color: #721c24;
    }
    .nav-button {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s;
    }
    .nav-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>
    
    <div class="deadline-section">
      <h2>提出期限</h2>
      <div class="deadline-text" id="deadlineText">2024年12月31日 17:00</div>
    </div>
    
    <div class="summary-section">
      <h2>部門別提出状況サマリー</h2>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み</th>
            <th>未提出</th>
            <th>提出率</th>
            <th>ステータス</th>
          </tr>
        </thead>
        <tbody id="summaryBody">
          <tr>
            <td>営業部</td>
            <td>8</td>
            <td>2</td>
            <td>80%</td>
            <td><span class="status-badge status-submitted">提出済</span></td>
          </tr>
          <tr>
            <td>企画部</td>
            <td>5</td>
            <td>1</td>
            <td>83%</td>
            <td><span class="status-badge status-submitted">提出済</span></td>
          </tr>
          <tr>
            <td>技術部</td>
            <td>6</td>
            <td>3</td>
            <td>67%</td>
            <td><span class="status-badge status-pending">未提出</span></td>
          </tr>
          <tr>
            <td>管理部</td>
            <td>4</td>
            <td>0</td>
            <td>100%</td>
            <td><span class="status-badge status-submitted">提出済</span></td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <button class="nav-button" onclick="goToDailyReport()">日報入力・送信へ</button>
  </div>
  
  <script>
    function goToDailyReport() {
      window.location.href = './daily-report.html';
    }
    
    function initPage() {
      // Set deadline to tomorrow at 17:00
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      tomorrow.setHours(17, 0, 0, 0);
      
      const deadlineText = tomorrow.toLocaleString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
      
      document.getElementById('deadlineText').textContent = deadlineText;
    }
    
    window.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
