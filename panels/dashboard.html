<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
      margin-bottom: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 28px;
    }
    .deadline-section {
      background-color: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .deadline-label {
      color: #856404;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 5px;
    }
    .deadline-time {
      color: #333;
      font-size: 18px;
      font-weight: 600;
    }
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #0066cc;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0052a3;
    }
    .summary-section {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    .summary-title {
      color: #333;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
    }
    .summary-table th {
      background-color: #f8f9fa;
      color: #333;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid #dee2e6;
      font-size: 14px;
    }
    .summary-table td {
      padding: 12px;
      border-bottom: 1px solid #dee2e6;
      font-size: 14px;
      color: #666;
    }
    .summary-table tr:hover {
      background-color: #f8f9fa;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-submitted {
      background-color: #d4edda;
      color: #155724;
    }
    .status-pending {
      background-color: #fff3cd;
      color: #856404;
    }
    .nav-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #0066cc;
      text-decoration: none;
      font-size: 14px;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="./daily-report.html" class="nav-link">日報入力・送信へ →</a>
    
    <header>
      <h1>日報提出状況ダッシュボード</h1>
      
      <div class="deadline-section">
        <div class="deadline-label">提出期限</div>
        <div class="deadline-time" id="deadlineTime">2024年1月31日 17:00</div>
      </div>
      
      <div class="action-buttons">
        <button class="btn-primary" onclick="window.location.href='./daily-report.html'">日報を入力する</button>
      </div>
    </header>
    
    <div class="summary-section">
      <div class="summary-title">部門別提出状況サマリー</div>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み</th>
            <th>未提出</th>
            <th>提出率</th>
          </tr>
        </thead>
        <tbody id="summaryTableBody">
          <tr>
            <td colspan="4" style="text-align: center; color: #999;">読み込み中...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  
  <script>
    async function loadDashboard() {
      try {
        // Set deadline
        const now = new Date();
        const deadline = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 17, 0, 0);
        document.getElementById('deadlineTime').textContent = deadline.toLocaleString('ja-JP', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        });
        
        // Load summary
        const response = await fetch('/api/summary');
        if (response.ok) {
          const summary = await response.json();
          const tbody = document.getElementById('summaryTableBody');
          
          if (summary.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #999;">データがありません</td></tr>';
          } else {
            tbody.innerHTML = summary.map(dept => {
              const total = dept.submitted + dept.pending;
              const rate = total > 0 ? Math.round((dept.submitted / total) * 100) : 0;
              return `
                <tr>
                  <td>${dept.name}</td>
                  <td><span class="status-badge status-submitted">${dept.submitted}件</span></td>
                  <td><span class="status-badge status-pending">${dept.pending}件</span></td>
                  <td>${rate}%</td>
                </tr>
              `;
            }).join('');
          }
        }
      } catch (error) {
        console.error('Error loading dashboard:', error);
        document.getElementById('summaryTableBody').innerHTML = '<tr><td colspan="4" style="text-align: center; color: #999;">エラーが発生しました</td></tr>';
      }
    }
    
    loadDashboard();
  </script>
</body>
</html>
