<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .deadline-section p {
            color: #856404;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .deadline-section .deadline-time {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .summary-section {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .summary-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
        }
        .summary-table th {
            background-color: #f8f9fa;
            color: #333;
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid #dee2e6;
            font-weight: 600;
            font-size: 14px;
        }
        .summary-table td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
            font-size: 14px;
            color: #555;
        }
        .summary-table tr:hover {
            background-color: #f9f9f9;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin: 5px 0;
        }
        .progress-fill {
            height: 100%;
            background-color: #28a745;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-submitted {
            background-color: #d4edda;
            color: #155724;
        }
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="./daily-report.html" class="nav-link">日報入力・送信へ →</a>
            
            <h1>日報提出状況ダッシュボード</h1>
            
            <div class="deadline-section">
                <p>提出期限:</p>
                <div class="deadline-time" id="deadlineTime">本日 18:00</div>
            </div>
            
            <div class="action-buttons">
                <button class="btn-primary" onclick="window.location.href='./daily-report.html'">日報を入力・送信</button>
            </div>
        </div>
        
        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み</th>
                        <th>未提出</th>
                        <th>提出率</th>
                        <th>進捗</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #999;">読み込み中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        async function loadDashboard() {
            // Set deadline
            const now = new Date();
            const deadline = new Date(now);
            deadline.setHours(18, 0, 0, 0);
            
            const deadlineStr = deadline.toLocaleString('ja-JP', {
                month: 'numeric',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            document.getElementById('deadlineTime').textContent = `本日 ${deadline.getHours()}:${String(deadline.getMinutes()).padStart(2, '0')}`;
            
            // Load summary data
            await loadSummary();
        }
        
        async function loadSummary() {
            try {
                const response = await fetch('/api/summary');
                if (response.ok) {
                    const data = await response.json();
                    renderSummary(data);
                } else {
                    renderDefaultSummary();
                }
            } catch (e) {
                renderDefaultSummary();
            }
        }
        
        function renderDefaultSummary() {
            const departments = [
                { name: '営業部', submitted: 8, total: 10 },
                { name: '企画部', submitted: 6, total: 8 },
                { name: '技術部', submitted: 12, total: 15 },
                { name: '管理部', submitted: 4, total: 5 }
            ];
            
            renderSummary(departments);
        }
        
        function renderSummary(departments) {
            const tbody = document.getElementById('summaryTableBody');
            
            tbody.innerHTML = departments.map(dept => {
                const pending = dept.total - dept.submitted;
                const rate = Math.round((dept.submitted / dept.total) * 100);
                
                return `
                    <tr>
                        <td>${dept.name}</td>
                        <td><span class="status-badge status-submitted">${dept.submitted}件</span></td>
                        <td><span class="status-badge status-pending">${pending}件</span></td>
                        <td>${rate}%</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${rate}%">${rate}%</div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        loadDashboard();
    </script>
</body>
</html>
