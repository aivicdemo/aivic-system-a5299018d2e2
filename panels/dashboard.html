<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報提出状況ダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .deadline-section {
      background-color: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .deadline-label {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .deadline-badge {
      display: inline-block;
      background-color: #ff6b6b;
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
    }
    .summary-section {
      background-color: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .summary-title {
      color: #333;
      font-size: 18px;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .summary-table {
      width: 100%;
      border-collapse: collapse;
    }
    .summary-table th {
      background-color: #f9f9f9;
      color: #333;
      padding: 12px;
      text-align: left;
      border-bottom: 2px solid #ddd;
      font-weight: 600;
    }
    .summary-table td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      color: #666;
    }
    .summary-table tr:hover {
      background-color: #f9f9f9;
    }
    .submission-rate {
      font-weight: bold;
      color: #28a745;
    }
    .submission-rate.low {
      color: #ff6b6b;
    }
    .submission-rate.medium {
      color: #ffc107;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報提出状況ダッシュボード</h1>
    
    <div class="deadline-section">
      <div class="deadline-label">提出期限</div>
      <div class="deadline-badge" id="deadlineDisplay">2024年12月31日 17:00</div>
    </div>
    
    <div class="summary-section">
      <div class="summary-title">部門別提出状況サマリー</div>
      <table class="summary-table">
        <thead>
          <tr>
            <th>部門名</th>
            <th>提出済み</th>
            <th>未提出</th>
            <th>提出率</th>
          </tr>
        </thead>
        <tbody id="summaryTableBody">
          <tr>
            <td>営業部</td>
            <td>8</td>
            <td>2</td>
            <td><span class="submission-rate">80%</span></td>
          </tr>
          <tr>
            <td>企画部</td>
            <td>5</td>
            <td>1</td>
            <td><span class="submission-rate">83%</span></td>
          </tr>
          <tr>
            <td>技術部</td>
            <td>10</td>
            <td>0</td>
            <td><span class="submission-rate">100%</span></td>
          </tr>
          <tr>
            <td>管理部</td>
            <td>3</td>
            <td>2</td>
            <td><span class="submission-rate medium">60%</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  
  <script>
    // Initialize dashboard
    function init() {
      // Set deadline display
      const deadline = new Date();
      deadline.setDate(deadline.getDate() + 7);
      deadline.setHours(17, 0, 0, 0);
      
      const deadlineDisplay = document.getElementById('deadlineDisplay');
      deadlineDisplay.textContent = deadline.toLocaleString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
      
      // Load and display summary data
      loadSummaryData();
    }
    
    function loadSummaryData() {
      // This would normally load from API
      // For now, using static data that's already in the HTML
      const tableBody = document.getElementById('summaryTableBody');
      
      // Calculate submission rates and apply styling
      const rows = tableBody.querySelectorAll('tr');
      rows.forEach(row => {
        const cells = row.querySelectorAll('td');
        if (cells.length >= 4) {
          const submitted = parseInt(cells[1].textContent);
          const notSubmitted = parseInt(cells[2].textContent);
          const total = submitted + notSubmitted;
          const rate = total > 0 ? Math.round((submitted / total) * 100) : 0;
          
          const rateCell = cells[3].querySelector('.submission-rate');
          if (rateCell) {
            rateCell.textContent = `${rate}%`;
            rateCell.classList.remove('low', 'medium');
            if (rate < 70) {
              rateCell.classList.add('low');
            } else if (rate < 90) {
              rateCell.classList.add('medium');
            }
          }
        }
      });
    }
    
    init();
  </script>
</body>
</html>
