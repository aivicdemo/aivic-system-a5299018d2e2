<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報提出状況ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .deadline-section {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .deadline-label {
            font-size: 14px;
            color: #856404;
            margin-bottom: 8px;
        }
        .deadline-time {
            font-size: 24px;
            font-weight: bold;
            color: #856404;
        }
        .summary-section {
            margin-top: 30px;
        }
        .summary-section h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        .summary-table th,
        .summary-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .summary-table th {
            background-color: #f9f9f9;
            font-weight: bold;
            color: #333;
        }
        .summary-table tr:hover {
            background-color: #f9f9f9;
        }
        .progress-bar {
            width: 100%;
            height: 24px;
            background-color: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .progress-fill {
            height: 100%;
            background-color: #28a745;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
        .btn-report {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        .btn-report:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報提出状況ダッシュボード</h1>
        
        <div class="deadline-section">
            <div class="deadline-label">提出期限</div>
            <div class="deadline-time" id="deadline">本日 18:00</div>
        </div>
        
        <div class="summary-section">
            <h2>部門別提出状況サマリー</h2>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>部門名</th>
                        <th>提出済み / 総人数</th>
                        <th>提出率</th>
                    </tr>
                </thead>
                <tbody id="summaryBody">
                    <tr>
                        <td>営業部</td>
                        <td><span id="sales-count">0</span> / 10</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" id="sales-progress" style="width: 0%">0%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>企画部</td>
                        <td><span id="planning-count">0</span> / 8</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" id="planning-progress" style="width: 0%">0%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>技術部</td>
                        <td><span id="tech-count">0</span> / 12</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" id="tech-progress" style="width: 0%">0%</div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>管理部</td>
                        <td><span id="admin-count">0</span> / 5</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" id="admin-progress" style="width: 0%">0%</div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <a href="./daily-report.html" class="btn-report">日報を入力・送信する</a>
    </div>
    
    <script>
        function initDashboard() {
            updateDeadline();
            updateSummary();
        }
        
        function updateDeadline() {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 18, 0, 0);
            
            if (now > today) {
                today.setDate(today.getDate() + 1);
            }
            
            const deadlineStr = today.toLocaleString('ja-JP', {
                month: 'numeric',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            document.getElementById('deadline').textContent = deadlineStr;
        }
        
        function updateSummary() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            
            // Count submissions by department
            const departments = {
                '営業部': { submitted: 0, total: 10 },
                '企画部': { submitted: 0, total: 8 },
                '技術部': { submitted: 0, total: 12 },
                '管理部': { submitted: 0, total: 5 }
            };
            
            history.forEach(item => {
                if (departments[item.department]) {
                    departments[item.department].submitted++;
                }
            });
            
            // Update UI
            const deptMap = {
                '営業部': 'sales',
                '企画部': 'planning',
                '技術部': 'tech',
                '管理部': 'admin'
            };
            
            Object.entries(departments).forEach(([dept, data]) => {
                const key = deptMap[dept];
                const percentage = Math.round((data.submitted / data.total) * 100);
                
                document.getElementById(`${key}-count`).textContent = data.submitted;
                const progressEl = document.getElementById(`${key}-progress`);
                progressEl.style.width = percentage + '%';
                progressEl.textContent = percentage + '%';
            });
        }
        
        initDashboard();
    </script>
</body>
</html>
