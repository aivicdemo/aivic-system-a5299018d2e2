<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .form-section {
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    input[type="date"]:disabled,
    select:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #545b62;
    }
    .btn-success {
      background-color: #28a745;
      color: white;
    }
    .btn-success:hover {
      background-color: #218838;
    }
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      color: #333;
      font-size: 18px;
      margin-bottom: 20px;
    }
    .history-empty {
      color: #999;
      font-size: 14px;
      padding: 20px;
      text-align: center;
      background-color: #f9f9f9;
      border-radius: 4px;
    }
    .history-item {
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .history-item-date {
      color: #666;
      font-weight: 500;
    }
    .history-item-status {
      background-color: #28a745;
      color: white;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 12px;
    }
    .history-item-content {
      font-size: 13px;
      color: #555;
      line-height: 1.6;
    }
    .history-item-content p {
      margin-bottom: 8px;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background-color: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .modal h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .modal-content {
      margin-bottom: 20px;
      font-size: 14px;
      color: #555;
      line-height: 1.6;
    }
    .modal-content p {
      margin-bottom: 10px;
    }
    .modal-content strong {
      color: #333;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .modal-buttons button {
      padding: 10px 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage">送信完了しました</div>
    
    <div class="form-section">
      <div class="form-group">
        <label for="reportDate">報告日付</label>
        <input type="date" id="reportDate">
        <div class="error-message" id="dateError">報告日付を選択してください</div>
      </div>
      
      <div class="form-group">
        <label for="department">部門</label>
        <select id="department">
          <option value="">選択してください</option>
          <option value="営業部">営業部</option>
          <option value="企画部">企画部</option>
          <option value="技術部">技術部</option>
          <option value="管理部">管理部</option>
        </select>
        <div class="error-message" id="departmentError">部門を選択してください</div>
      </div>
      
      <div class="form-group">
        <label for="yesterday">昨日やったこと</label>
        <textarea id="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
        <div class="error-message" id="yesterdayError"></div>
      </div>
      
      <div class="form-group">
        <label for="today">今日やること</label>
        <textarea id="today" placeholder="今日予定している業務内容を入力してください" disabled></textarea>
        <div class="error-message" id="todayError"></div>
      </div>
      
      <div class="form-group">
        <label for="issues">抱えている課題</label>
        <textarea id="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
        <div class="error-message" id="issuesError"></div>
      </div>
      
      <div class="button-group">
        <button class="btn-secondary" id="editBtn" onclick="enableEdit()">報告内容編集ボタン</button>
        <button class="btn-primary" id="draftBtn" onclick="saveDraft()">下書き保存</button>
        <button class="btn-success" id="submitBtn" onclick="openConfirmDialog()">送信</button>
      </div>
    </div>
    
    <div class="history-section">
      <h2>送信履歴</h2>
      <div id="historyContainer">
        <div class="history-empty">送信履歴はありません</div>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h2>送信確認</h2>
      <div class="modal-content">
        <p><strong>昨日やったこと:</strong></p>
        <p id="confirmYesterday"></p>
        <p><strong>今日やること:</strong></p>
        <p id="confirmToday"></p>
        <p><strong>抱えている課題:</strong></p>
        <p id="confirmIssues"></p>
        <p style="margin-top: 15px;"><strong>送信者:</strong></p>
        <p id="confirmSender"></p>
        <p><strong>部長:</strong></p>
        <p id="confirmBucho"></p>
      </div>
      <div class="modal-buttons">
        <button class="btn-secondary" onclick="closeConfirmDialog()">キャンセル</button>
        <button class="btn-success" onclick="submitReport()">確認</button>
      </div>
    </div>
  </div>
  
  <script>
    let currentUser = null;
    let history = [];
    let isEditMode = false;
    
    async function initPage() {
      // Get current user from session/auth
      const userResponse = await fetch('/api/user', { credentials: 'include' });
      if (userResponse.ok) {
        currentUser = await userResponse.json();
      } else {
        // Fallback for testing
        currentUser = { id: 'testuser', email: 'testuser@example.com', name: 'Test User', bucho: 'bucho@example.com', buchoName: '部長太郎' };
      }
      
      // Load draft from sessionStorage
      const draft = sessionStorage.getItem('reportDraft');
      if (draft) {
        const draftData = JSON.parse(draft);
        document.getElementById('reportDate').value = draftData.date || '';
        document.getElementById('department').value = draftData.department || '';
        document.getElementById('yesterday').value = draftData.yesterday || '';
        document.getElementById('today').value = draftData.today || '';
        document.getElementById('issues').value = draftData.issues || '';
      }
      
      // Load history from localStorage
      const savedHistory = localStorage.getItem('reportHistory');
      if (savedHistory) {
        history = JSON.parse(savedHistory);
      }
      
      renderHistory();
      
      // Restore date selection from sessionStorage
      const savedDate = sessionStorage.getItem('selectedDate');
      if (savedDate) {
        document.getElementById('reportDate').value = savedDate;
      }
      
      // Restore department selection from sessionStorage
      const savedDept = sessionStorage.getItem('selectedDepartment');
      if (savedDept) {
        document.getElementById('department').value = savedDept;
      }
    }
    
    function enableEdit() {
      isEditMode = true;
      document.getElementById('yesterday').disabled = false;
      document.getElementById('today').disabled = false;
      document.getElementById('issues').disabled = false;
      document.getElementById('editBtn').style.display = 'none';
    }
    
    function saveDraft() {
      const draftData = {
        date: document.getElementById('reportDate').value,
        department: document.getElementById('department').value,
        yesterday: document.getElementById('yesterday').value,
        today: document.getElementById('today').value,
        issues: document.getElementById('issues').value
      };
      sessionStorage.setItem('reportDraft', JSON.stringify(draftData));
      alert('下書きを保存しました');
    }
    
    function validateForm() {
      let isValid = true;
      
      // Clear all error messages
      document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
      
      const date = document.getElementById('reportDate').value;
      const department = document.getElementById('department').value;
      const yesterday = document.getElementById('yesterday').value.trim();
      const today = document.getElementById('today').value.trim();
      const issues = document.getElementById('issues').value.trim();
      
      if (!date) {
        document.getElementById('dateError').classList.add('show');
        isValid = false;
      }
      
      if (!department) {
        document.getElementById('departmentError').classList.add('show');
        isValid = false;
      }
      
      if (!yesterday && !today && !issues) {
        document.getElementById('yesterdayError').textContent = '報告内容を入力してください';
        document.getElementById('yesterdayError').classList.add('show');
        isValid = false;
      }
      
      return isValid;
    }
    
    function openConfirmDialog() {
      if (!validateForm()) {
        return;
      }
      
      const yesterday = document.getElementById('yesterday').value.trim();
      const today = document.getElementById('today').value.trim();
      const issues = document.getElementById('issues').value.trim();
      
      document.getElementById('confirmYesterday').textContent = yesterday || '(未入力)';
      document.getElementById('confirmToday').textContent = today || '(未入力)';
      document.getElementById('confirmIssues').textContent = issues || '(未入力)';
      document.getElementById('confirmSender').textContent = currentUser.email;
      document.getElementById('confirmBucho').textContent = `${currentUser.buchoName} <${currentUser.bucho}>`;
      
      document.getElementById('confirmModal').classList.add('show');
    }
    
    function closeConfirmDialog() {
      document.getElementById('confirmModal').classList.remove('show');
    }
    
    function submitReport() {
      const date = document.getElementById('reportDate').value;
      const department = document.getElementById('department').value;
      const yesterday = document.getElementById('yesterday').value.trim();
      const today = document.getElementById('today').value.trim();
      const issues = document.getElementById('issues').value.trim();
      
      const now = new Date();
      const timestamp = now.toLocaleString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      
      const report = {
        id: Date.now().toString(),
        date: date,
        department: department,
        yesterday: yesterday,
        today: today,
        issues: issues,
        sender: currentUser.id,
        timestamp: timestamp,
        status: '送信済'
      };
      
      history.unshift(report);
      localStorage.setItem('reportHistory', JSON.stringify(history));
      
      // Save to sessionStorage for date/department persistence
      sessionStorage.setItem('selectedDate', date);
      sessionStorage.setItem('selectedDepartment', department);
      
      // Clear form
      document.getElementById('yesterday').value = '';
      document.getElementById('today').value = '';
      document.getElementById('issues').value = '';
      document.getElementById('yesterday').disabled = true;
      document.getElementById('today').disabled = true;
      document.getElementById('issues').disabled = true;
      document.getElementById('editBtn').style.display = 'inline-block';
      isEditMode = false;
      
      // Clear draft
      sessionStorage.removeItem('reportDraft');
      
      // Show success message
      const successMsg = document.getElementById('successMessage');
      successMsg.classList.add('show');
      setTimeout(() => {
        successMsg.classList.remove('show');
      }, 3000);
      
      // Close modal
      closeConfirmDialog();
      
      // Refresh history
      renderHistory();
    }
    
    function renderHistory() {
      const container = document.getElementById('historyContainer');
      
      if (history.length === 0) {
        container.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
        return;
      }
      
      container.innerHTML = history.map(item => `
        <div class="history-item">
          <div class="history-item-header">
            <span class="history-item-date">${item.timestamp}</span>
            <span class="history-item-status">${item.status}</span>
          </div>
          <div class="history-item-content">
            <p><strong>昨日やったこと:</strong> ${item.yesterday || '(未入力)'}</p>
            <p><strong>今日やること:</strong> ${item.today || '(未入力)'}</p>
            <p><strong>抱えている課題:</strong> ${item.issues || '(未入力)'}</p>
          </div>
        </div>
      `).join('');
    }
    
    // Initialize on page load
    window.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
