<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力・送信画面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .form-section {
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input[type="date"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    input[type="date"]:focus,
    select:focus {
      outline: none;
      border-color: #0066cc;
      box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
    }
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }
    textarea:focus {
      outline: none;
      border-color: #0066cc;
      box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
    }
    textarea:disabled {
      background-color: #f9f9f9;
      color: #666;
      cursor: not-allowed;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background-color: #0066cc;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0052a3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #5a6268;
    }
    .btn-success {
      background-color: #28a745;
      color: white;
    }
    .btn-success:hover {
      background-color: #218838;
    }
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .modal h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .modal-content {
      margin-bottom: 20px;
      color: #666;
      line-height: 1.6;
    }
    .modal-content p {
      margin-bottom: 10px;
    }
    .modal-content strong {
      color: #333;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .history-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }
    .history-section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .history-item {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      background-color: #fafafa;
    }
    .history-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .history-item-date {
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    .history-item-status {
      background-color: #28a745;
      color: white;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 500;
    }
    .history-item-content {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }
    .history-item-content p {
      margin-bottom: 5px;
    }
    .empty-history {
      text-align: center;
      color: #999;
      padding: 20px;
      font-size: 14px;
    }
    .nav-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #0066cc;
      text-decoration: none;
      font-size: 14px;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
    
    <h1>日報入力・送信</h1>
    
    <div class="success-message" id="successMessage">送信完了しました</div>
    
    <form id="reportForm">
      <div class="form-section">
        <div class="form-group">
          <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
          <input type="date" id="reportDate" name="reportDate" required>
          <div class="error-message" id="dateError">報告日付を選択してください</div>
        </div>
        
        <div class="form-group">
          <label for="department">部門 <span style="color: red;">*</span></label>
          <select id="department" name="department" required>
            <option value="">-- 選択してください --</option>
            <option value="営業部">営業部</option>
            <option value="企画部">企画部</option>
            <option value="技術部">技術部</option>
            <option value="管理部">管理部</option>
          </select>
          <div class="error-message" id="departmentError">部門を選択してください</div>
        </div>
      </div>
      
      <div class="form-section">
        <div class="form-group">
          <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
          <textarea id="yesterday" name="yesterday" placeholder="昨日の業務内容を入力してください" disabled></textarea>
          <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
        </div>
        
        <div class="form-group">
          <label for="today">今日やること <span style="color: red;">*</span></label>
          <textarea id="today" name="today" placeholder="今日の予定を入力してください" disabled></textarea>
          <div class="error-message" id="todayError">報告内容を入力してください</div>
        </div>
        
        <div class="form-group">
          <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
          <textarea id="issues" name="issues" placeholder="現在の課題を入力してください" disabled></textarea>
          <div class="error-message" id="issuesError">報告内容を入力してください</div>
        </div>
      </div>
      
      <div class="button-group">
        <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
        <button type="button" id="saveDraftBtn" class="btn-secondary">下書き保存</button>
        <button type="submit" id="submitBtn" class="btn-primary">送信</button>
      </div>
    </form>
    
    <div class="history-section">
      <h2>送信履歴</h2>
      <div class="history-list" id="historyList">
        <div class="empty-history">送信履歴はありません</div>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h2>送信確認</h2>
      <div class="modal-content" id="modalContent">
        <p><strong>昨日やったこと:</strong></p>
        <p id="modalYesterday"></p>
        <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
        <p id="modalToday"></p>
        <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
        <p id="modalIssues"></p>
        <p style="margin-top: 15px;"><strong>送信者:</strong></p>
        <p id="modalSender"></p>
        <p style="margin-top: 15px;"><strong>部長:</strong></p>
        <p id="modalManager"></p>
      </div>
      <div class="modal-buttons">
        <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
        <button type="button" id="confirmBtn" class="btn-primary">確認</button>
      </div>
    </div>
  </div>
  
  <script>
    const reportForm = document.getElementById('reportForm');
    const editBtn = document.getElementById('editBtn');
    const saveDraftBtn = document.getElementById('saveDraftBtn');
    const submitBtn = document.getElementById('submitBtn');
    const confirmModal = document.getElementById('confirmModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const successMessage = document.getElementById('successMessage');
    const historyList = document.getElementById('historyList');
    
    const yesterdayField = document.getElementById('yesterday');
    const todayField = document.getElementById('today');
    const issuesField = document.getElementById('issues');
    const reportDateField = document.getElementById('reportDate');
    const departmentField = document.getElementById('department');
    
    let isEditing = false;
    let currentUser = null;
    let currentManager = null;
    
    // Initialize
    async function init() {
      await loadUserData();
      loadFormState();
      loadHistory();
      disableTextareas();
    }
    
    async function loadUserData() {
      try {
        const response = await fetch('/api/user');
        if (response.ok) {
          const data = await response.json();
          currentUser = data;
          document.getElementById('modalSender').textContent = data.email || 'testuser@example.com';
          
          // Load manager info
          const managerResponse = await fetch(`/api/manager/${data.userId}`);
          if (managerResponse.ok) {
            const managerData = await managerResponse.json();
            currentManager = managerData;
            document.getElementById('modalManager').textContent = `${managerData.name} <${managerData.email}>`;
          }
        }
      } catch (error) {
        console.error('Error loading user data:', error);
        document.getElementById('modalSender').textContent = 'testuser@example.com';
        document.getElementById('modalManager').textContent = '部長 <bucho@example.com>';
      }
    }
    
    function loadFormState() {
      const saved = sessionStorage.getItem('reportFormState');
      if (saved) {
        const state = JSON.parse(saved);
        yesterdayField.value = state.yesterday || '';
        todayField.value = state.today || '';
        issuesField.value = state.issues || '';
        reportDateField.value = state.reportDate || '';
        departmentField.value = state.department || '';
      }
    }
    
    function saveFormState() {
      const state = {
        yesterday: yesterdayField.value,
        today: todayField.value,
        issues: issuesField.value,
        reportDate: reportDateField.value,
        department: departmentField.value
      };
      sessionStorage.setItem('reportFormState', JSON.stringify(state));
    }
    
    function disableTextareas() {
      yesterdayField.disabled = true;
      todayField.disabled = true;
      issuesField.disabled = true;
    }
    
    function enableTextareas() {
      yesterdayField.disabled = false;
      todayField.disabled = false;
      issuesField.disabled = false;
    }
    
    editBtn.addEventListener('click', () => {
      isEditing = true;
      enableTextareas();
      editBtn.style.display = 'none';
    });
    
    saveDraftBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      saveFormState();
      
      try {
        await fetch('/api/draft', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            yesterday: yesterdayField.value,
            today: todayField.value,
            issues: issuesField.value,
            reportDate: reportDateField.value,
            department: departmentField.value
          })
        });
        alert('下書きを保存しました');
      } catch (error) {
        console.error('Error saving draft:', error);
      }
    });
    
    reportForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      // Clear previous errors
      document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
      
      // Validate
      let isValid = true;
      
      if (!reportDateField.value) {
        document.getElementById('dateError').classList.add('show');
        isValid = false;
      }
      
      if (!departmentField.value) {
        document.getElementById('departmentError').classList.add('show');
        isValid = false;
      }
      
      const yesterday = yesterdayField.value.trim();
      const today = todayField.value.trim();
      const issues = issuesField.value.trim();
      
      if (!yesterday && !today && !issues) {
        document.getElementById('yesterdayError').classList.add('show');
        document.getElementById('todayError').classList.add('show');
        document.getElementById('issuesError').classList.add('show');
        isValid = false;
      }
      
      if (!isValid) return;
      
      // Show confirmation modal
      document.getElementById('modalYesterday').textContent = yesterday.substring(0, 100);
      document.getElementById('modalToday').textContent = today.substring(0, 100);
      document.getElementById('modalIssues').textContent = issues.substring(0, 100);
      confirmModal.classList.add('show');
    });
    
    cancelBtn.addEventListener('click', () => {
      confirmModal.classList.remove('show');
    });
    
    confirmBtn.addEventListener('click', async () => {
      confirmModal.classList.remove('show');
      
      try {
        const response = await fetch('/api/report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            yesterday: yesterdayField.value,
            today: todayField.value,
            issues: issuesField.value,
            reportDate: reportDateField.value,
            department: departmentField.value
          })
        });
        
        if (response.ok) {
          successMessage.classList.add('show');
          yesterdayField.value = '';
          todayField.value = '';
          issuesField.value = '';
          disableTextareas();
          editBtn.style.display = 'inline-block';
          isEditing = false;
          sessionStorage.removeItem('reportFormState');
          
          setTimeout(() => {
            successMessage.classList.remove('show');
          }, 3000);
          
          loadHistory();
        }
      } catch (error) {
        console.error('Error submitting report:', error);
        alert('送信に失敗しました');
      }
    });
    
    async function loadHistory() {
      try {
        const response = await fetch('/api/reports');
        if (response.ok) {
          const reports = await response.json();
          
          if (reports.length === 0) {
            historyList.innerHTML = '<div class="empty-history">送信履歴はありません</div>';
          } else {
            historyList.innerHTML = reports.map(report => `
              <div class="history-item">
                <div class="history-item-header">
                  <span class="history-item-date">${new Date(report.submittedAt).toLocaleString('ja-JP')}</span>
                  <span class="history-item-status">送信済</span>
                </div>
                <div class="history-item-content">
                  <p><strong>昨日やったこと:</strong> ${report.yesterday}</p>
                  <p><strong>今日やること:</strong> ${report.today}</p>
                  <p><strong>抱えている課題:</strong> ${report.issues}</p>
                </div>
              </div>
            `).join('');
          }
        }
      } catch (error) {
        console.error('Error loading history:', error);
      }
    }
    
    // Save form state on input
    [yesterdayField, todayField, issuesField, reportDateField, departmentField].forEach(field => {
      field.addEventListener('change', saveFormState);
      field.addEventListener('input', saveFormState);
    });
    
    init();
  </script>
</body>
</html>
