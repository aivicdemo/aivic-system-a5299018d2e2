<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-section {
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        input[type="date"]:disabled,
        select:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            background-color: #fafafa;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
            color: #666;
        }
        .history-item-content {
            font-size: 13px;
            color: #333;
            line-height: 1.5;
        }
        .history-item-content p {
            margin-bottom: 8px;
        }
        .history-item-content strong {
            color: #007bff;
        }
        .empty-history {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }
        .status-badge {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage"></div>
        
        <form id="reportForm">
            <div class="form-section">
                <div class="form-group">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError"></div>
                </div>
                
                <div class="form-group">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">選択してください</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError"></div>
                </div>
                
                <div class="form-group">
                    <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                    <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                    <div class="error-message" id="yesterdayError"></div>
                </div>
                
                <div class="form-group">
                    <label for="today">今日やること <span style="color: red;">*</span></label>
                    <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                    <div class="error-message" id="todayError"></div>
                </div>
                
                <div class="form-group">
                    <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                    <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                    <div class="error-message" id="issuesError"></div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-secondary" id="editBtn" style="display: none;">報告内容編集</button>
                <button type="button" class="btn-primary" id="draftBtn">下書き保存</button>
                <button type="submit" class="btn-success" id="submitBtn">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div class="history-list" id="historyList">
                <div class="empty-history">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee;">
                    <strong>送信者:</strong> <span id="senderEmail"></span>
                </p>
                <p style="margin-top: 10px;">
                    <strong>部長:</strong> <span id="chiefEmail"></span>
                </p>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
                <button type="button" class="btn-success" id="confirmBtn">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        // ユーザー情報（セッションから取得）
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || '{"id": "testuser", "email": "testuser@example.com", "name": "テストユーザー", "chief": "部長太郎", "chiefEmail": "bucho@example.com"}');
        
        // 初期化
        function initializeForm() {
            const yesterday = document.getElementById('yesterday');
            const today = document.getElementById('today');
            const issues = document.getElementById('issues');
            const reportDate = document.getElementById('reportDate');
            const department = document.getElementById('department');
            const editBtn = document.getElementById('editBtn');
            const draftBtn = document.getElementById('draftBtn');
            const submitBtn = document.getElementById('submitBtn');
            
            // セッションストレージから前回の選択値を復元
            const savedDate = sessionStorage.getItem('reportDate');
            const savedDept = sessionStorage.getItem('department');
            const savedYesterday = sessionStorage.getItem('reportYesterday');
            const savedToday = sessionStorage.getItem('reportToday');
            const savedIssues = sessionStorage.getItem('reportIssues');
            
            if (savedDate) reportDate.value = savedDate;
            if (savedDept) department.value = savedDept;
            if (savedYesterday) yesterday.value = savedYesterday;
            if (savedToday) today.value = savedToday;
            if (savedIssues) issues.value = savedIssues;
            
            // 下書き保存データを復元
            const draftData = localStorage.getItem('reportDraft');
            if (draftData) {
                const draft = JSON.parse(draftData);
                yesterday.value = draft.yesterday || '';
                today.value = draft.today || '';
                issues.value = draft.issues || '';
                reportDate.value = draft.reportDate || '';
                department.value = draft.department || '';
                enableEditMode();
            }
            
            // 入力値の変更を監視してセッションストレージに保存
            reportDate.addEventListener('change', () => {
                sessionStorage.setItem('reportDate', reportDate.value);
            });
            
            department.addEventListener('change', () => {
                sessionStorage.setItem('department', department.value);
            });
            
            yesterday.addEventListener('input', () => {
                sessionStorage.setItem('reportYesterday', yesterday.value);
            });
            
            today.addEventListener('input', () => {
                sessionStorage.setItem('reportToday', today.value);
            });
            
            issues.addEventListener('input', () => {
                sessionStorage.setItem('reportIssues', issues.value);
            });
            
            // 下書き保存ボタン
            draftBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const draftData = {
                    yesterday: yesterday.value,
                    today: today.value,
                    issues: issues.value,
                    reportDate: reportDate.value,
                    department: department.value,
                    savedAt: new Date().toISOString()
                };
                localStorage.setItem('reportDraft', JSON.stringify(draftData));
                alert('下書きを保存しました');
            });
            
            // 編集ボタン
            editBtn.addEventListener('click', (e) => {
                e.preventDefault();
                enableEditMode();
            });
            
            // フォーム送信
            document.getElementById('reportForm').addEventListener('submit', (e) => {
                e.preventDefault();
                handleSubmit();
            });
            
            // 確認ダイアログのボタン
            document.getElementById('cancelBtn').addEventListener('click', () => {
                document.getElementById('confirmModal').classList.remove('show');
            });
            
            document.getElementById('confirmBtn').addEventListener('click', () => {
                sendReport();
            });
            
            // 履歴を読み込む
            loadHistory();
            
            // 初期状態で編集ボタンを表示（下書きがない場合）
            if (!draftData) {
                editBtn.style.display = 'none';
            } else {
                editBtn.style.display = 'inline-block';
                yesterday.disabled = true;
                today.disabled = true;
                issues.disabled = true;
            }
        }
        
        function enableEditMode() {
            const yesterday = document.getElementById('yesterday');
            const today = document.getElementById('today');
            const issues = document.getElementById('issues');
            const editBtn = document.getElementById('editBtn');
            
            yesterday.disabled = false;
            today.disabled = false;
            issues.disabled = false;
            editBtn.style.display = 'none';
            
            // フォーカスを最初のフィールドに
            yesterday.focus();
        }
        
        function clearErrors() {
            document.getElementById('dateError').textContent = '';
            document.getElementById('dateError').classList.remove('show');
            document.getElementById('departmentError').textContent = '';
            document.getElementById('departmentError').classList.remove('show');
            document.getElementById('yesterdayError').textContent = '';
            document.getElementById('yesterdayError').classList.remove('show');
            document.getElementById('todayError').textContent = '';
            document.getElementById('todayError').classList.remove('show');
            document.getElementById('issuesError').textContent = '';
            document.getElementById('issuesError').classList.remove('show');
        }
        
        function handleSubmit() {
            clearErrors();
            
            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();
            
            let hasError = false;
            
            if (!reportDate) {
                document.getElementById('dateError').textContent = '報告日付を選択してください';
                document.getElementById('dateError').classList.add('show');
                hasError = true;
            }
            
            if (!department) {
                document.getElementById('departmentError').textContent = '部門を選択してください';
                document.getElementById('departmentError').classList.add('show');
                hasError = true;
            }
            
            if (!yesterday && !today && !issues) {
                document.getElementById('yesterdayError').textContent = '報告内容を入力してください';
                document.getElementById('yesterdayError').classList.add('show');
                hasError = true;
            }
            
            if (hasError) return;
            
            // 確認ダイアログを表示
            document.getElementById('confirmYesterday').textContent = yesterday.substring(0, 100) || '(未入力)';
            document.getElementById('confirmToday').textContent = today.substring(0, 100) || '(未入力)';
            document.getElementById('confirmIssues').textContent = issues.substring(0, 100) || '(未入力)';
            document.getElementById('senderEmail').textContent = currentUser.email;
            document.getElementById('chiefEmail').textContent = `${currentUser.chief} <${currentUser.chiefEmail}>`;
            
            document.getElementById('confirmModal').classList.add('show');
        }
        
        function sendReport() {
            const reportDate = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();
            
            // 履歴に追加
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            const newRecord = {
                id: Date.now(),
                date: new Date().toLocaleString('ja-JP'),
                sender: currentUser.id,
                status: '送信済',
                yesterday: yesterday,
                today: today,
                issues: issues,
                reportDate: reportDate,
                department: department
            };
            history.unshift(newRecord);
            localStorage.setItem('reportHistory', JSON.stringify(history));
            
            // ダイアログを閉じる
            document.getElementById('confirmModal').classList.remove('show');
            
            // フォームをクリア
            document.getElementById('reportForm').reset();
            document.getElementById('yesterday').disabled = true;
            document.getElementById('today').disabled = true;
            document.getElementById('issues').disabled = true;
            document.getElementById('editBtn').style.display = 'none';
            
            // 下書きを削除
            localStorage.removeItem('reportDraft');
            
            // セッションストレージをクリア
            sessionStorage.removeItem('reportYesterday');
            sessionStorage.removeItem('reportToday');
            sessionStorage.removeItem('reportIssues');
            
            // 成功メッセージを表示
            const successMsg = document.getElementById('successMessage');
            successMsg.textContent = '送信完了しました';
            successMsg.classList.add('show');
            setTimeout(() => {
                successMsg.classList.remove('show');
            }, 3000);
            
            // 履歴を再読み込み
            loadHistory();
        }
        
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            const historyList = document.getElementById('historyList');
            
            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-history">送信履歴はありません</div>';
                return;
            }
            
            historyList.innerHTML = history.map(record => `
                <div class="history-item">
                    <div class="history-item-header">
                        <span>送信日時: ${record.date}</span>
                        <span class="status-badge">${record.status}</span>
                    </div>
                    <div class="history-item-content">
                        <p><strong>昨日やったこと:</strong> ${record.yesterday}</p>
                        <p><strong>今日やること:</strong> ${record.today}</p>
                        <p><strong>抱えている課題:</strong> ${record.issues}</p>
                    </div>
                </div>
            `).join('');
        }
        
        // ページ読み込み時に初期化
        document.addEventListener('DOMContentLoaded', initializeForm);
    </script>
</body>
</html>
