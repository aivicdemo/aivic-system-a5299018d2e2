<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-edit {
            background-color: #28a745;
            color: white;
        }
        .btn-edit:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .modal-body {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-summary {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .modal-summary-item {
            margin-bottom: 10px;
        }
        .modal-summary-label {
            font-weight: bold;
            color: #333;
        }
        .modal-summary-text {
            color: #666;
            word-break: break-word;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-footer button {
            padding: 10px 20px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }
        .history-empty {
            color: #999;
            font-style: italic;
            padding: 20px;
            text-align: center;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        .history-item {
            background-color: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            border-left: 4px solid #007bff;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .history-item-date {
            color: #666;
            font-weight: bold;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        .history-item-content-item {
            margin-bottom: 8px;
        }
        .history-item-content-label {
            font-weight: bold;
            color: #333;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
        
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage">送信完了しました</div>
        
        <form id="reportForm">
            <div class="form-group">
                <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                <input type="date" id="reportDate" name="reportDate" required>
                <div class="error-message" id="dateError">報告日付を選択してください</div>
            </div>
            
            <div class="form-group">
                <label for="department">部門 <span style="color: red;">*</span></label>
                <select id="department" name="department" required>
                    <option value="">-- 選択してください --</option>
                    <option value="営業部">営業部</option>
                    <option value="企画部">企画部</option>
                    <option value="技術部">技術部</option>
                    <option value="管理部">管理部</option>
                </select>
                <div class="error-message" id="departmentError">部門を選択してください</div>
            </div>
            
            <div class="form-group">
                <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                <textarea id="yesterday" name="yesterday" disabled></textarea>
                <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
            </div>
            
            <div class="form-group">
                <label for="today">今日やること <span style="color: red;">*</span></label>
                <textarea id="today" name="today" disabled></textarea>
                <div class="error-message" id="todayError">報告内容を入力してください</div>
            </div>
            
            <div class="form-group">
                <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                <textarea id="issues" name="issues" disabled></textarea>
                <div class="error-message" id="issuesError">報告内容を入力してください</div>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-edit" id="editBtn">報告内容編集</button>
                <button type="button" class="btn-secondary" id="draftBtn">下書き保存</button>
                <button type="submit" class="btn-primary" id="submitBtn">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div id="historyContainer">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-header">送信確認</div>
            <div class="modal-body">
                <div class="modal-summary">
                    <div class="modal-summary-item">
                        <span class="modal-summary-label">昨日やったこと:</span>
                        <div class="modal-summary-text" id="summaryYesterday"></div>
                    </div>
                    <div class="modal-summary-item">
                        <span class="modal-summary-label">今日やること:</span>
                        <div class="modal-summary-text" id="summaryToday"></div>
                    </div>
                    <div class="modal-summary-item">
                        <span class="modal-summary-label">抱えている課題:</span>
                        <div class="modal-summary-text" id="summaryIssues"></div>
                    </div>
                </div>
                <div style="margin-top: 15px; font-size: 13px;">
                    <div style="margin-bottom: 8px;">
                        <span style="font-weight: bold;">送信者:</span>
                        <span id="senderEmail">testuser@example.com</span>
                    </div>
                    <div>
                        <span style="font-weight: bold;">部長:</span>
                        <span id="managerEmail">部長 &lt;bucho@example.com&gt;</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
                <button type="button" class="btn-primary" id="confirmBtn">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const reportForm = document.getElementById('reportForm');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const successMessage = document.getElementById('successMessage');
        const historyContainer = document.getElementById('historyContainer');
        
        const reportDateInput = document.getElementById('reportDate');
        const departmentSelect = document.getElementById('department');
        const yesterdayTextarea = document.getElementById('yesterday');
        const todayTextarea = document.getElementById('today');
        const issuesTextarea = document.getElementById('issues');
        
        // Initialize
        function initPage() {
            loadDraft();
            loadHistory();
            attachEventListeners();
        }
        
        function attachEventListeners() {
            editBtn.addEventListener('click', enableEdit);
            draftBtn.addEventListener('click', saveDraft);
            reportForm.addEventListener('submit', handleSubmit);
            cancelBtn.addEventListener('click', closeConfirmModal);
            confirmBtn.addEventListener('click', sendReport);
            
            // Save date and department to sessionStorage on change
            reportDateInput.addEventListener('change', () => {
                sessionStorage.setItem('reportDate', reportDateInput.value);
            });
            departmentSelect.addEventListener('change', () => {
                sessionStorage.setItem('department', departmentSelect.value);
            });
        }
        
        function enableEdit() {
            yesterdayTextarea.disabled = false;
            todayTextarea.disabled = false;
            issuesTextarea.disabled = false;
            yesterdayTextarea.focus();
        }
        
        function saveDraft() {
            const draft = {
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value,
                timestamp: new Date().toISOString()
            };
            localStorage.setItem('reportDraft', JSON.stringify(draft));
            alert('下書きを保存しました');
        }
        
        function loadDraft() {
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                yesterdayTextarea.value = data.yesterday || '';
                todayTextarea.value = data.today || '';
                issuesTextarea.value = data.issues || '';
            }
            
            // Load date and department from sessionStorage
            const savedDate = sessionStorage.getItem('reportDate');
            if (savedDate) {
                reportDateInput.value = savedDate;
            }
            const savedDept = sessionStorage.getItem('department');
            if (savedDept) {
                departmentSelect.value = savedDept;
            }
        }
        
        function handleSubmit(e) {
            e.preventDefault();
            
            // Clear previous errors
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            
            // Validate
            let isValid = true;
            
            if (!reportDateInput.value) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }
            if (!departmentSelect.value) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }
            if (!yesterdayTextarea.value.trim()) {
                document.getElementById('yesterdayError').classList.add('show');
                isValid = false;
            }
            if (!todayTextarea.value.trim()) {
                document.getElementById('todayError').classList.add('show');
                isValid = false;
            }
            if (!issuesTextarea.value.trim()) {
                document.getElementById('issuesError').classList.add('show');
                isValid = false;
            }
            
            if (!isValid) return;
            
            // Show confirm modal
            showConfirmModal();
        }
        
        function showConfirmModal() {
            document.getElementById('summaryYesterday').textContent = yesterdayTextarea.value.substring(0, 50);
            document.getElementById('summaryToday').textContent = todayTextarea.value.substring(0, 50);
            document.getElementById('summaryIssues').textContent = issuesTextarea.value.substring(0, 50);
            confirmModal.classList.add('show');
        }
        
        function closeConfirmModal() {
            confirmModal.classList.remove('show');
        }
        
        function sendReport() {
            const report = {
                date: reportDateInput.value,
                department: departmentSelect.value,
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value,
                sender: 'testuser@example.com',
                timestamp: new Date().toISOString(),
                status: '送信済'
            };
            
            // Get existing history
            let history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            history.unshift(report);
            localStorage.setItem('reportHistory', JSON.stringify(history));
            
            // Clear form
            closeConfirmModal();
            yesterdayTextarea.value = '';
            todayTextarea.value = '';
            issuesTextarea.value = '';
            yesterdayTextarea.disabled = true;
            todayTextarea.disabled = true;
            issuesTextarea.disabled = true;
            
            // Clear draft
            localStorage.removeItem('reportDraft');
            
            // Show success message
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
            
            // Reload history
            loadHistory();
        }
        
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            
            if (history.length === 0) {
                historyContainer.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
                return;
            }
            
            historyContainer.innerHTML = history.map(item => {
                const date = new Date(item.timestamp);
                const dateStr = date.toLocaleString('ja-JP', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                
                return `
                    <div class="history-item">
                        <div class="history-item-header">
                            <span class="history-item-date">${dateStr}</span>
                            <span class="history-item-status">${item.status}</span>
                        </div>
                        <div class="history-item-content">
                            <div class="history-item-content-item">
                                <span class="history-item-content-label">昨日やったこと:</span> ${item.yesterday}
                            </div>
                            <div class="history-item-content-item">
                                <span class="history-item-content-label">今日やること:</span> ${item.today}
                            </div>
                            <div class="history-item-content-item">
                                <span class="history-item-content-label">抱えている課題:</span> ${item.issues}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Initialize on page load
        initPage();
    </script>
</body>
</html>
