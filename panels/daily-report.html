<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
        }
        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #1976d2;
            color: white;
        }
        .btn-primary:hover {
            background-color: #1565c0;
        }
        .btn-secondary {
            background-color: #757575;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #616161;
        }
        .btn-success {
            background-color: #388e3c;
            color: white;
        }
        .btn-success:hover {
            background-color: #2e7d32;
        }
        .success-message {
            background-color: #c8e6c9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background-color: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-empty {
            color: #999;
            padding: 20px;
            text-align: center;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            color: #666;
            font-size: 13px;
        }
        .history-item-status {
            background-color: #4caf50;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-item-content p {
            margin-bottom: 8px;
        }
        .history-item-content strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報入力・送信画面</h1>
        
        <div class="success-message" id="successMessage">送信完了しました</div>
        
        <form id="reportForm">
            <div class="form-group">
                <label for="reportDate">報告日付 <span style="color: #d32f2f;">*</span></label>
                <input type="date" id="reportDate" name="reportDate" required>
                <div class="error-message" id="dateError">報告日付を選択してください</div>
            </div>
            
            <div class="form-group">
                <label for="department">部門 <span style="color: #d32f2f;">*</span></label>
                <select id="department" name="department" required>
                    <option value="">-- 選択してください --</option>
                    <option value="営業部">営業部</option>
                    <option value="企画部">企画部</option>
                    <option value="技術部">技術部</option>
                    <option value="管理部">管理部</option>
                </select>
                <div class="error-message" id="departmentError">部門を選択してください</div>
            </div>
            
            <div class="form-group">
                <label for="yesterday">昨日やったこと <span style="color: #d32f2f;">*</span></label>
                <textarea id="yesterday" name="yesterday" disabled></textarea>
            </div>
            
            <div class="form-group">
                <label for="today">今日やること <span style="color: #d32f2f;">*</span></label>
                <textarea id="today" name="today" disabled></textarea>
            </div>
            
            <div class="form-group">
                <label for="issues">抱えている課題 <span style="color: #d32f2f;">*</span></label>
                <textarea id="issues" name="issues" disabled></textarea>
            </div>
            
            <div class="error-message" id="contentError">報告内容を入力してください</div>
            
            <div class="button-group">
                <button type="button" class="btn-secondary" id="editBtn">報告内容編集ボタン</button>
                <button type="button" class="btn-success" id="draftBtn">下書き保存</button>
                <button type="submit" class="btn-primary" id="submitBtn">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div id="historyContainer">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content" id="modalContent">
                <!-- Content will be inserted here -->
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
                <button type="button" class="btn-primary" id="confirmBtn">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        // Initialize form state from sessionStorage
        function initializeForm() {
            const savedDate = sessionStorage.getItem('reportDate');
            const savedDepartment = sessionStorage.getItem('department');
            const savedYesterday = sessionStorage.getItem('yesterday');
            const savedToday = sessionStorage.getItem('today');
            const savedIssues = sessionStorage.getItem('issues');
            
            if (savedDate) document.getElementById('reportDate').value = savedDate;
            if (savedDepartment) document.getElementById('department').value = savedDepartment;
            if (savedYesterday) document.getElementById('yesterday').value = savedYesterday;
            if (savedToday) document.getElementById('today').value = savedToday;
            if (savedIssues) document.getElementById('issues').value = savedIssues;
            
            loadHistory();
        }
        
        // Save form state to sessionStorage
        function saveFormState() {
            sessionStorage.setItem('reportDate', document.getElementById('reportDate').value);
            sessionStorage.setItem('department', document.getElementById('department').value);
            sessionStorage.setItem('yesterday', document.getElementById('yesterday').value);
            sessionStorage.setItem('today', document.getElementById('today').value);
            sessionStorage.setItem('issues', document.getElementById('issues').value);
        }
        
        // Enable editing
        document.getElementById('editBtn').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('yesterday').disabled = false;
            document.getElementById('today').disabled = false;
            document.getElementById('issues').disabled = false;
            document.getElementById('yesterday').focus();
        });
        
        // Draft save
        document.getElementById('draftBtn').addEventListener('click', function(e) {
            e.preventDefault();
            saveFormState();
            // Save to localStorage for persistence across page reloads
            const draftData = {
                date: document.getElementById('reportDate').value,
                department: document.getElementById('department').value,
                yesterday: document.getElementById('yesterday').value,
                today: document.getElementById('today').value,
                issues: document.getElementById('issues').value
            };
            localStorage.setItem('reportDraft', JSON.stringify(draftData));
            alert('下書きを保存しました');
        });
        
        // Load draft if exists
        function loadDraft() {
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                document.getElementById('yesterday').value = data.yesterday || '';
                document.getElementById('today').value = data.today || '';
                document.getElementById('issues').value = data.issues || '';
            }
        }
        
        // Form submission
        document.getElementById('reportForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Clear previous errors
            document.getElementById('dateError').classList.remove('show');
            document.getElementById('departmentError').classList.remove('show');
            document.getElementById('contentError').classList.remove('show');
            
            const date = document.getElementById('reportDate').value;
            const department = document.getElementById('department').value;
            const yesterday = document.getElementById('yesterday').value.trim();
            const today = document.getElementById('today').value.trim();
            const issues = document.getElementById('issues').value.trim();
            
            let hasError = false;
            
            if (!date) {
                document.getElementById('dateError').classList.add('show');
                hasError = true;
            }
            
            if (!department) {
                document.getElementById('departmentError').classList.add('show');
                hasError = true;
            }
            
            if (!yesterday && !today && !issues) {
                document.getElementById('contentError').classList.add('show');
                hasError = true;
            }
            
            if (hasError) return;
            
            // Show confirmation dialog
            showConfirmDialog(date, department, yesterday, today, issues);
        });
        
        // Show confirmation dialog
        function showConfirmDialog(date, department, yesterday, today, issues) {
            const userEmail = 'testuser@example.com';
            const bucho = 'bucho@example.com';
            
            const content = `
                <p><strong>報告日付:</strong> ${date}</p>
                <p><strong>部門:</strong> ${department}</p>
                <p><strong>昨日やったこと:</strong> ${yesterday.substring(0, 50)}${yesterday.length > 50 ? '...' : ''}</p>
                <p><strong>今日やること:</strong> ${today.substring(0, 50)}${today.length > 50 ? '...' : ''}</p>
                <p><strong>抱えている課題:</strong> ${issues.substring(0, 50)}${issues.length > 50 ? '...' : ''}</p>
                <p style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px;">
                    <strong>送信者:</strong> ${userEmail}<br>
                    <strong>部長:</strong> 部長名 &lt;${bucho}&gt;
                </p>
            `;
            
            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('confirmModal').classList.add('show');
            
            // Store data for confirmation
            window.pendingReport = { date, department, yesterday, today, issues };
        }
        
        // Cancel confirmation
        document.getElementById('cancelBtn').addEventListener('click', function() {
            document.getElementById('confirmModal').classList.remove('show');
        });
        
        // Confirm submission
        document.getElementById('confirmBtn').addEventListener('click', function() {
            document.getElementById('confirmModal').classList.remove('show');
            
            const report = window.pendingReport;
            const timestamp = new Date().toLocaleString('ja-JP');
            
            // Add to history
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            history.unshift({
                date: timestamp,
                sender: 'testuser',
                status: '送信済',
                yesterday: report.yesterday,
                today: report.today,
                issues: report.issues
            });
            localStorage.setItem('reportHistory', JSON.stringify(history));
            
            // Clear form
            document.getElementById('reportForm').reset();
            document.getElementById('yesterday').disabled = true;
            document.getElementById('today').disabled = true;
            document.getElementById('issues').disabled = true;
            
            // Clear draft
            localStorage.removeItem('reportDraft');
            sessionStorage.clear();
            
            // Show success message
            const successMsg = document.getElementById('successMessage');
            successMsg.classList.add('show');
            setTimeout(() => successMsg.classList.remove('show'), 3000);
            
            // Reload history
            loadHistory();
        });
        
        // Load and display history
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            const container = document.getElementById('historyContainer');
            
            if (history.length === 0) {
                container.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
                return;
            }
            
            container.innerHTML = history.map(item => `
                <div class="history-item">
                    <div class="history-item-header">
                        <div>
                            <div class="history-item-date">${item.date}</div>
                            <div style="color: #333; font-weight: 500; margin-top: 5px;">送信者: ${item.sender}</div>
                        </div>
                        <div class="history-item-status">${item.status}</div>
                    </div>
                    <div class="history-item-content">
                        <p><strong>昨日やったこと:</strong> ${item.yesterday}</p>
                        <p><strong>今日やること:</strong> ${item.today}</p>
                        <p><strong>抱えている課題:</strong> ${item.issues}</p>
                    </div>
                </div>
            `).join('');
        }
        
        // Save state on input change
        document.getElementById('reportDate').addEventListener('change', saveFormState);
        document.getElementById('department').addEventListener('change', saveFormState);
        document.getElementById('yesterday').addEventListener('input', saveFormState);
        document.getElementById('today').addEventListener('input', saveFormState);
        document.getElementById('issues').addEventListener('input', saveFormState);
        
        // Initialize on page load
        window.addEventListener('load', function() {
            loadDraft();
            initializeForm();
        });
    </script>
</body>
</html>
