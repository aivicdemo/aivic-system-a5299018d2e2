<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            min-height: 100px;
            resize: vertical;
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background-color: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
        }
        .history-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-list {
            list-style: none;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 500;
            color: #333;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-empty {
            color: #999;
            text-align: center;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage"></div>
        
        <form id="reportForm">
            <div class="form-section">
                <div class="form-group">
                    <label for="reportDate">報告日付</label>
                    <input type="date" id="reportDate" name="reportDate">
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>
                
                <div class="form-group">
                    <label for="department">部門</label>
                    <select id="department" name="department">
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
            </div>
            
            <div class="form-section">
                <div class="form-group">
                    <label for="yesterday">昨日やったこと</label>
                    <textarea id="yesterday" name="yesterday" disabled></textarea>
                </div>
                
                <div class="form-group">
                    <label for="today">今日やること</label>
                    <textarea id="today" name="today" disabled></textarea>
                </div>
                
                <div class="form-group">
                    <label for="issues">抱えている課題</label>
                    <textarea id="issues" name="issues" disabled></textarea>
                </div>
                <div class="error-message" id="contentError">報告内容を入力してください</div>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn-secondary" id="editBtn">報告内容編集</button>
                <button type="button" class="btn-primary" id="draftBtn">下書き保存</button>
                <button type="submit" class="btn-success" id="submitBtn">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <ul class="history-list" id="historyList">
                <li class="history-empty">送信履歴はありません</li>
            </ul>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday"></p>
                <p><strong>今日やること:</strong></p>
                <p id="confirmToday"></p>
                <p><strong>抱えている課題:</strong></p>
                <p id="confirmIssues"></p>
                <p style="margin-top: 15px;"><strong>送信者:</strong> <span id="confirmSender"></span></p>
                <p><strong>部長:</strong> <span id="confirmBucho"></span></p>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
                <button type="button" class="btn-success" id="confirmBtn">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const reportForm = document.getElementById('reportForm');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const yesterdayField = document.getElementById('yesterday');
        const todayField = document.getElementById('today');
        const issuesField = document.getElementById('issues');
        const reportDateField = document.getElementById('reportDate');
        const departmentField = document.getElementById('department');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const successMessage = document.getElementById('successMessage');
        const historyList = document.getElementById('historyList');
        
        let isEditMode = false;
        let history = [];
        
        // Initialize
        function init() {
            loadFromSessionStorage();
            loadHistory();
            updateHistoryDisplay();
            
            // Set current user info
            const userEmail = sessionStorage.getItem('userEmail') || 'testuser@example.com';
            document.getElementById('confirmSender').textContent = userEmail;
            
            // Set department head email (mock)
            const departmentHeadEmail = 'bucho@example.com';
            document.getElementById('confirmBucho').textContent = '部長 <' + departmentHeadEmail + '>';
        }
        
        function loadFromSessionStorage() {
            const savedDate = sessionStorage.getItem('reportDate');
            const savedDept = sessionStorage.getItem('department');
            const savedYesterday = sessionStorage.getItem('yesterday');
            const savedToday = sessionStorage.getItem('today');
            const savedIssues = sessionStorage.getItem('issues');
            
            if (savedDate) reportDateField.value = savedDate;
            if (savedDept) departmentField.value = savedDept;
            if (savedYesterday) yesterdayField.value = savedYesterday;
            if (savedToday) todayField.value = savedToday;
            if (savedIssues) issuesField.value = savedIssues;
        }
        
        function saveToSessionStorage() {
            sessionStorage.setItem('reportDate', reportDateField.value);
            sessionStorage.setItem('department', departmentField.value);
            sessionStorage.setItem('yesterday', yesterdayField.value);
            sessionStorage.setItem('today', todayField.value);
            sessionStorage.setItem('issues', issuesField.value);
        }
        
        function loadHistory() {
            const saved = localStorage.getItem('reportHistory');
            if (saved) {
                history = JSON.parse(saved);
            }
        }
        
        function saveHistory() {
            localStorage.setItem('reportHistory', JSON.stringify(history));
        }
        
        function updateHistoryDisplay() {
            if (history.length === 0) {
                historyList.innerHTML = '<li class="history-empty">送信履歴はありません</li>';
                return;
            }
            
            historyList.innerHTML = history.map(item => `
                <li class="history-item">
                    <div class="history-item-header">
                        <span class="history-item-date">${item.date}</span>
                        <span class="history-item-status">送信済</span>
                    </div>
                    <div class="history-item-content">
                        <p><strong>昨日やったこと:</strong> ${item.yesterday.substring(0, 50)}${item.yesterday.length > 50 ? '...' : ''}</p>
                        <p><strong>今日やること:</strong> ${item.today.substring(0, 50)}${item.today.length > 50 ? '...' : ''}</p>
                        <p><strong>抱えている課題:</strong> ${item.issues.substring(0, 50)}${item.issues.length > 50 ? '...' : ''}</p>
                    </div>
                </li>
            `).join('');
        }
        
        function clearErrors() {
            document.getElementById('dateError').classList.remove('show');
            document.getElementById('departmentError').classList.remove('show');
            document.getElementById('contentError').classList.remove('show');
        }
        
        function validate() {
            clearErrors();
            let isValid = true;
            
            if (!reportDateField.value) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }
            
            if (!departmentField.value) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }
            
            const hasContent = yesterdayField.value.trim() || todayField.value.trim() || issuesField.value.trim();
            if (!hasContent) {
                document.getElementById('contentError').classList.add('show');
                isValid = false;
            }
            
            return isValid;
        }
        
        editBtn.addEventListener('click', function() {
            isEditMode = true;
            yesterdayField.disabled = false;
            todayField.disabled = false;
            issuesField.disabled = false;
            editBtn.style.display = 'none';
        });
        
        draftBtn.addEventListener('click', function() {
            saveToSessionStorage();
            alert('下書きを保存しました');
        });
        
        reportForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!validate()) {
                return;
            }
            
            // Show confirmation modal
            document.getElementById('confirmYesterday').textContent = yesterdayField.value;
            document.getElementById('confirmToday').textContent = todayField.value;
            document.getElementById('confirmIssues').textContent = issuesField.value;
            confirmModal.classList.add('show');
        });
        
        cancelBtn.addEventListener('click', function() {
            confirmModal.classList.remove('show');
        });
        
        confirmBtn.addEventListener('click', function() {
            confirmModal.classList.remove('show');
            
            // Add to history
            const now = new Date();
            const dateStr = now.getFullYear() + '年' + 
                           String(now.getMonth() + 1).padStart(2, '0') + '月' + 
                           String(now.getDate()).padStart(2, '0') + '日 ' +
                           String(now.getHours()).padStart(2, '0') + ':' +
                           String(now.getMinutes()).padStart(2, '0') + ':' +
                           String(now.getSeconds()).padStart(2, '0');
            
            history.unshift({
                date: dateStr,
                yesterday: yesterdayField.value,
                today: todayField.value,
                issues: issuesField.value
            });
            
            saveHistory();
            updateHistoryDisplay();
            
            // Clear form
            yesterdayField.value = '';
            todayField.value = '';
            issuesField.value = '';
            reportDateField.value = '';
            departmentField.value = '';
            yesterdayField.disabled = true;
            todayField.disabled = true;
            issuesField.disabled = true;
            isEditMode = false;
            editBtn.style.display = 'inline-block';
            
            // Clear session storage
            sessionStorage.removeItem('yesterday');
            sessionStorage.removeItem('today');
            sessionStorage.removeItem('issues');
            
            // Show success message
            successMessage.textContent = '送信完了しました';
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        });
        
        init();
    </script>
</body>
</html>
