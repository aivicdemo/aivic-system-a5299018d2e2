<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-section {
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            min-height: 100px;
            resize: vertical;
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
            cursor: not-allowed;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .history-section {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-item-date {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .history-item-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-item-content p {
            margin-bottom: 8px;
        }
        .history-empty {
            color: #999;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
        
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage">送信完了しました</div>
        
        <form id="reportForm">
            <div class="form-section">
                <div class="form-group">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>
                
                <div class="form-group">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
                
                <div class="form-group">
                    <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                    <textarea id="yesterday" name="yesterday" disabled></textarea>
                    <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
                </div>
                
                <div class="form-group">
                    <label for="today">今日やること <span style="color: red;">*</span></label>
                    <textarea id="today" name="today" disabled></textarea>
                    <div class="error-message" id="todayError">報告内容を入力してください</div>
                </div>
                
                <div class="form-group">
                    <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                    <textarea id="issues" name="issues" disabled></textarea>
                    <div class="error-message" id="issuesError">報告内容を入力してください</div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
                <button type="button" id="draftBtn" class="btn-secondary">下書き保存</button>
                <button type="submit" id="submitBtn" class="btn-success">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <div class="history-list" id="historyList">
                <div class="history-empty">送信履歴はありません</div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #666;"></p>
                <p style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee;">
                    <strong>送信者:</strong> <span id="senderEmail"></span>
                </p>
                <p style="margin-top: 10px;">
                    <strong>部長:</strong> <span id="chiefEmail"></span>
                </p>
            </div>
            <div class="modal-buttons">
                <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
                <button type="button" id="confirmBtn" class="btn-success">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('reportForm');
        const editBtn = document.getElementById('editBtn');
        const draftBtn = document.getElementById('draftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const successMessage = document.getElementById('successMessage');
        const historyList = document.getElementById('historyList');
        
        const yesterdayField = document.getElementById('yesterday');
        const todayField = document.getElementById('today');
        const issuesField = document.getElementById('issues');
        const reportDateField = document.getElementById('reportDate');
        const departmentField = document.getElementById('department');
        
        let isEditMode = false;
        let pendingSubmit = false;
        
        // Initialize
        function init() {
            loadDraft();
            loadHistory();
            loadUserInfo();
        }
        
        function loadUserInfo() {
            const userInfo = JSON.parse(sessionStorage.getItem('userInfo') || '{}');
            document.getElementById('senderEmail').textContent = userInfo.email || 'testuser@example.com';
            document.getElementById('chiefEmail').textContent = userInfo.chiefName ? `${userInfo.chiefName} <${userInfo.chiefEmail}>` : 'Chief <chief@example.com>';
        }
        
        function loadDraft() {
            const draft = JSON.parse(sessionStorage.getItem('reportDraft') || '{}');
            if (draft.yesterday) yesterdayField.value = draft.yesterday;
            if (draft.today) todayField.value = draft.today;
            if (draft.issues) issuesField.value = draft.issues;
            if (draft.reportDate) reportDateField.value = draft.reportDate;
            if (draft.department) departmentField.value = draft.department;
        }
        
        function saveDraft() {
            const draft = {
                yesterday: yesterdayField.value,
                today: todayField.value,
                issues: issuesField.value,
                reportDate: reportDateField.value,
                department: departmentField.value
            };
            sessionStorage.setItem('reportDraft', JSON.stringify(draft));
        }
        
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-empty">送信履歴はありません</div>';
            } else {
                historyList.innerHTML = history.map(item => `
                    <div class="history-item">
                        <div class="history-item-header">
                            <div class="history-item-date">${item.timestamp}</div>
                            <div class="history-item-status">送信済</div>
                        </div>
                        <div class="history-item-content">
                            <p><strong>昨日やったこと:</strong> ${item.yesterday.substring(0, 50)}${item.yesterday.length > 50 ? '...' : ''}</p>
                            <p><strong>今日やること:</strong> ${item.today.substring(0, 50)}${item.today.length > 50 ? '...' : ''}</p>
                            <p><strong>抱えている課題:</strong> ${item.issues.substring(0, 50)}${item.issues.length > 50 ? '...' : ''}</p>
                        </div>
                    </div>
                `).join('');
            }
        }
        
        editBtn.addEventListener('click', () => {
            isEditMode = true;
            yesterdayField.disabled = false;
            todayField.disabled = false;
            issuesField.disabled = false;
            editBtn.style.display = 'none';
        });
        
        draftBtn.addEventListener('click', (e) => {
            e.preventDefault();
            saveDraft();
            alert('下書きを保存しました');
        });
        
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Clear previous errors
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            
            // Validate
            let isValid = true;
            
            if (!reportDateField.value) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }
            
            if (!departmentField.value) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }
            
            if (!yesterdayField.value.trim()) {
                document.getElementById('yesterdayError').classList.add('show');
                isValid = false;
            }
            
            if (!todayField.value.trim()) {
                document.getElementById('todayError').classList.add('show');
                isValid = false;
            }
            
            if (!issuesField.value.trim()) {
                document.getElementById('issuesError').classList.add('show');
                isValid = false;
            }
            
            if (!isValid) return;
            
            // Show confirmation modal
            document.getElementById('confirmYesterday').textContent = yesterdayField.value.substring(0, 100);
            document.getElementById('confirmToday').textContent = todayField.value.substring(0, 100);
            document.getElementById('confirmIssues').textContent = issuesField.value.substring(0, 100);
            
            confirmModal.classList.add('show');
            pendingSubmit = true;
        });
        
        cancelBtn.addEventListener('click', () => {
            confirmModal.classList.remove('show');
            pendingSubmit = false;
        });
        
        confirmBtn.addEventListener('click', () => {
            confirmModal.classList.remove('show');
            
            // Add to history
            const now = new Date();
            const timestamp = now.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            history.unshift({
                timestamp: timestamp,
                yesterday: yesterdayField.value,
                today: todayField.value,
                issues: issuesField.value,
                sender: JSON.parse(sessionStorage.getItem('userInfo') || '{}').userId || 'user'
            });
            localStorage.setItem('reportHistory', JSON.stringify(history));
            
            // Clear form
            yesterdayField.value = '';
            todayField.value = '';
            issuesField.value = '';
            yesterdayField.disabled = true;
            todayField.disabled = true;
            issuesField.disabled = true;
            editBtn.style.display = 'block';
            isEditMode = false;
            
            // Clear draft
            sessionStorage.removeItem('reportDraft');
            
            // Show success message
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
            
            // Reload history
            loadHistory();
            
            pendingSubmit = false;
        });
        
        // Save draft on input change
        [yesterdayField, todayField, issuesField, reportDateField, departmentField].forEach(field => {
            field.addEventListener('change', saveDraft);
            field.addEventListener('input', saveDraft);
        });
        
        init();
    </script>
</body>
</html>
