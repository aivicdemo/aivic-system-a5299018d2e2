<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報入力・送信画面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-section {
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        textarea:disabled {
            background-color: #f9f9f9;
            color: #666;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .modal h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 18px;
        }
        .modal-content {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
        }
        .modal-content p {
            margin-bottom: 10px;
        }
        .modal-content strong {
            color: #333;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 10px 20px;
        }
        .history-section {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        .history-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .history-list {
            list-style: none;
        }
        .history-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .history-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .history-item-date {
            color: #666;
            font-weight: 500;
        }
        .history-item-status {
            background-color: #28a745;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .history-item-content {
            color: #555;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-item-content p {
            margin-bottom: 8px;
        }
        .empty-history {
            color: #999;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./dashboard.html" class="nav-link">← ダッシュボードに戻る</a>
        
        <h1>日報入力・送信</h1>
        
        <div class="success-message" id="successMessage"></div>
        
        <form id="reportForm">
            <div class="form-section">
                <div class="form-group">
                    <label for="reportDate">報告日付 <span style="color: red;">*</span></label>
                    <input type="date" id="reportDate" name="reportDate" required>
                    <div class="error-message" id="dateError">報告日付を選択してください</div>
                </div>
                
                <div class="form-group">
                    <label for="department">部門 <span style="color: red;">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">-- 選択してください --</option>
                        <option value="営業部">営業部</option>
                        <option value="企画部">企画部</option>
                        <option value="技術部">技術部</option>
                        <option value="管理部">管理部</option>
                    </select>
                    <div class="error-message" id="departmentError">部門を選択してください</div>
                </div>
                
                <div class="form-group">
                    <label for="yesterday">昨日やったこと <span style="color: red;">*</span></label>
                    <textarea id="yesterday" name="yesterday" placeholder="昨日実施した業務内容を入力してください" disabled></textarea>
                    <div class="error-message" id="yesterdayError">報告内容を入力してください</div>
                </div>
                
                <div class="form-group">
                    <label for="today">今日やること <span style="color: red;">*</span></label>
                    <textarea id="today" name="today" placeholder="本日予定している業務内容を入力してください" disabled></textarea>
                    <div class="error-message" id="todayError">報告内容を入力してください</div>
                </div>
                
                <div class="form-group">
                    <label for="issues">抱えている課題 <span style="color: red;">*</span></label>
                    <textarea id="issues" name="issues" placeholder="現在抱えている課題や懸念事項を入力してください" disabled></textarea>
                    <div class="error-message" id="issuesError">報告内容を入力してください</div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" id="editBtn" class="btn-secondary">報告内容編集</button>
                <button type="button" id="saveDraftBtn" class="btn-secondary">下書き保存</button>
                <button type="submit" id="submitBtn" class="btn-primary">送信</button>
            </div>
        </form>
        
        <div class="history-section">
            <h2>送信履歴</h2>
            <ul class="history-list" id="historyList">
                <li class="empty-history">送信履歴はありません</li>
            </ul>
        </div>
    </div>
    
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>送信確認</h2>
            <div class="modal-content">
                <p><strong>昨日やったこと:</strong></p>
                <p id="confirmYesterday" style="margin-left: 10px; color: #555;"></p>
                <p style="margin-top: 15px;"><strong>今日やること:</strong></p>
                <p id="confirmToday" style="margin-left: 10px; color: #555;"></p>
                <p style="margin-top: 15px;"><strong>抱えている課題:</strong></p>
                <p id="confirmIssues" style="margin-left: 10px; color: #555;"></p>
                <p style="margin-top: 15px;"><strong>送信者:</strong></p>
                <p id="confirmSender" style="margin-left: 10px; color: #555;"></p>
                <p style="margin-top: 15px;"><strong>部長:</strong></p>
                <p id="confirmManager" style="margin-left: 10px; color: #555;"></p>
            </div>
            <div class="modal-buttons">
                <button type="button" id="cancelBtn" class="btn-secondary">キャンセル</button>
                <button type="button" id="confirmBtn" class="btn-success">確認</button>
            </div>
        </div>
    </div>
    
    <script>
        const reportForm = document.getElementById('reportForm');
        const editBtn = document.getElementById('editBtn');
        const saveDraftBtn = document.getElementById('saveDraftBtn');
        const submitBtn = document.getElementById('submitBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const successMessage = document.getElementById('successMessage');
        
        const reportDateInput = document.getElementById('reportDate');
        const departmentSelect = document.getElementById('department');
        const yesterdayTextarea = document.getElementById('yesterday');
        const todayTextarea = document.getElementById('today');
        const issuesTextarea = document.getElementById('issues');
        const historyList = document.getElementById('historyList');
        
        let isEditing = false;
        let currentUser = null;
        let currentManager = null;
        
        // Initialize
        async function init() {
            await loadUserData();
            loadDraft();
            loadHistory();
            updateEditState();
        }
        
        async function loadUserData() {
            try {
                const response = await fetch('/api/user');
                if (response.ok) {
                    const data = await response.json();
                    currentUser = data.email;
                    currentManager = data.manager;
                }
            } catch (e) {
                currentUser = 'testuser@example.com';
                currentManager = { name: '部長太郎', email: 'bucho@example.com' };
            }
        }
        
        function loadDraft() {
            const draft = localStorage.getItem('reportDraft');
            if (draft) {
                const data = JSON.parse(draft);
                if (data.reportDate) reportDateInput.value = data.reportDate;
                if (data.department) departmentSelect.value = data.department;
                if (data.yesterday) yesterdayTextarea.value = data.yesterday;
                if (data.today) todayTextarea.value = data.today;
                if (data.issues) issuesTextarea.value = data.issues;
            }
            
            // Restore date and department from sessionStorage
            const savedDate = sessionStorage.getItem('reportDate');
            if (savedDate) reportDateInput.value = savedDate;
            
            const savedDept = sessionStorage.getItem('reportDepartment');
            if (savedDept) departmentSelect.value = savedDept;
        }
        
        function saveDraft() {
            const draft = {
                reportDate: reportDateInput.value,
                department: departmentSelect.value,
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value
            };
            localStorage.setItem('reportDraft', JSON.stringify(draft));
            
            // Save date and department to sessionStorage
            sessionStorage.setItem('reportDate', reportDateInput.value);
            sessionStorage.setItem('reportDepartment', departmentSelect.value);
            
            showSuccessMessage('下書きを保存しました');
        }
        
        function updateEditState() {
            if (isEditing) {
                yesterdayTextarea.disabled = false;
                todayTextarea.disabled = false;
                issuesTextarea.disabled = false;
                editBtn.textContent = '編集完了';
                editBtn.classList.remove('btn-secondary');
                editBtn.classList.add('btn-primary');
            } else {
                yesterdayTextarea.disabled = true;
                todayTextarea.disabled = true;
                issuesTextarea.disabled = true;
                editBtn.textContent = '報告内容編集';
                editBtn.classList.remove('btn-primary');
                editBtn.classList.add('btn-secondary');
            }
        }
        
        editBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isEditing = !isEditing;
            updateEditState();
        });
        
        saveDraftBtn.addEventListener('click', (e) => {
            e.preventDefault();
            saveDraft();
        });
        
        reportForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (validateForm()) {
                showConfirmDialog();
            }
        });
        
        function validateForm() {
            let isValid = true;
            
            // Clear all errors
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            
            if (!reportDateInput.value) {
                document.getElementById('dateError').classList.add('show');
                isValid = false;
            }
            
            if (!departmentSelect.value) {
                document.getElementById('departmentError').classList.add('show');
                isValid = false;
            }
            
            if (!yesterdayTextarea.value.trim()) {
                document.getElementById('yesterdayError').classList.add('show');
                isValid = false;
            }
            
            if (!todayTextarea.value.trim()) {
                document.getElementById('todayError').classList.add('show');
                isValid = false;
            }
            
            if (!issuesTextarea.value.trim()) {
                document.getElementById('issuesError').classList.add('show');
                isValid = false;
            }
            
            return isValid;
        }
        
        function showConfirmDialog() {
            document.getElementById('confirmYesterday').textContent = yesterdayTextarea.value.substring(0, 50) + (yesterdayTextarea.value.length > 50 ? '...' : '');
            document.getElementById('confirmToday').textContent = todayTextarea.value.substring(0, 50) + (todayTextarea.value.length > 50 ? '...' : '');
            document.getElementById('confirmIssues').textContent = issuesTextarea.value.substring(0, 50) + (issuesTextarea.value.length > 50 ? '...' : '');
            document.getElementById('confirmSender').textContent = currentUser || 'testuser@example.com';
            document.getElementById('confirmManager').textContent = currentManager ? `${currentManager.name} <${currentManager.email}>` : '部長太郎 <bucho@example.com>';
            confirmModal.classList.add('show');
        }
        
        cancelBtn.addEventListener('click', () => {
            confirmModal.classList.remove('show');
        });
        
        confirmBtn.addEventListener('click', async () => {
            confirmModal.classList.remove('show');
            await submitReport();
        });
        
        async function submitReport() {
            const reportData = {
                date: reportDateInput.value,
                department: departmentSelect.value,
                yesterday: yesterdayTextarea.value,
                today: todayTextarea.value,
                issues: issuesTextarea.value,
                sender: currentUser || 'testuser@example.com',
                timestamp: new Date().toISOString()
            };
            
            try {
                const response = await fetch('/api/reports', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(reportData)
                });
                
                if (response.ok) {
                    // Save to history
                    let history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
                    history.unshift(reportData);
                    localStorage.setItem('reportHistory', JSON.stringify(history));
                    
                    // Clear form
                    yesterdayTextarea.value = '';
                    todayTextarea.value = '';
                    issuesTextarea.value = '';
                    localStorage.removeItem('reportDraft');
                    
                    showSuccessMessage('送信完了しました');
                    loadHistory();
                }
            } catch (e) {
                // Fallback: save to localStorage
                let history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
                history.unshift(reportData);
                localStorage.setItem('reportHistory', JSON.stringify(history));
                
                yesterdayTextarea.value = '';
                todayTextarea.value = '';
                issuesTextarea.value = '';
                localStorage.removeItem('reportDraft');
                
                showSuccessMessage('送信完了しました');
                loadHistory();
            }
        }
        
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('reportHistory') || '[]');
            
            if (history.length === 0) {
                historyList.innerHTML = '<li class="empty-history">送信履歴はありません</li>';
                return;
            }
            
            historyList.innerHTML = history.map((item, index) => {
                const date = new Date(item.timestamp);
                const dateStr = date.toLocaleString('ja-JP', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                
                return `
                    <li class="history-item">
                        <div class="history-item-header">
                            <span class="history-item-date">${dateStr}</span>
                            <span class="history-item-status">送信済</span>
                        </div>
                        <div class="history-item-content">
                            <p><strong>昨日やったこと:</strong> ${item.yesterday}</p>
                            <p><strong>今日やること:</strong> ${item.today}</p>
                            <p><strong>抱えている課題:</strong> ${item.issues}</p>
                        </div>
                    </li>
                `;
            }).join('');
        }
        
        function showSuccessMessage(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
        
        init();
    </script>
</body>
</html>
